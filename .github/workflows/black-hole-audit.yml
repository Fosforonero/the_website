name: Black hole playground audit

on:
  push:
    branches: [init]
    paths:
      - "components/lab/black-hole/playground-physics.ts"
      - "scripts/black-hole/audit-playground-dynamics.ts"
  pull_request:
    paths:
      - "components/lab/black-hole/playground-physics.ts"
      - "scripts/black-hole/audit-playground-dynamics.ts"

permissions:
  contents: read

concurrency:
  group: black-hole-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run N-body dynamics audit
        run: pnpm black-hole:audit
